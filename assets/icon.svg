  <path d="M2 13.5a8 8 0 0 1 8-8h57a8 8 0 0 1 8 8V34H2z" fill="#1e8e3e"/>
  <path d="M12 22h30" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M12 48h42M12 60h30M12 72h36" stroke="#bdc1c6" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M2 82h73v-1.5a8 8 0 0 1-8 8H10a8 8 0 0 1-8-8z" fill="#4285f4"/>
